name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build and run unit tests
        run: ./gradlew build

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Check for required secrets
        id: check-secrets
        env:
          INSFORGE_BASE_URL: ${{ secrets.INSFORGE_BASE_URL }}
          INSFORGE_ANON_KEY: ${{ secrets.INSFORGE_ANON_KEY }}
          INSFORGE_TEST_EMAIL: ${{ secrets.INSFORGE_TEST_EMAIL }}
          INSFORGE_TEST_PASSWORD: ${{ secrets.INSFORGE_TEST_PASSWORD }}
        run: |
          if [[ -z "$INSFORGE_BASE_URL" || -z "$INSFORGE_ANON_KEY" || -z "$INSFORGE_TEST_EMAIL" || -z "$INSFORGE_TEST_PASSWORD" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Integration-test secrets are incomplete; skipping integration tests"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check-secrets.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        if: steps.check-secrets.outputs.available == 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        if: steps.check-secrets.outputs.available == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run integration tests
        if: steps.check-secrets.outputs.available == 'true'
        run: ./gradlew integrationTest
        env:
          INSFORGE_BASE_URL: ${{ secrets.INSFORGE_BASE_URL }}
          INSFORGE_ANON_KEY: ${{ secrets.INSFORGE_ANON_KEY }}
          INSFORGE_TEST_EMAIL: ${{ secrets.INSFORGE_TEST_EMAIL }}
          INSFORGE_TEST_PASSWORD: ${{ secrets.INSFORGE_TEST_PASSWORD }}
